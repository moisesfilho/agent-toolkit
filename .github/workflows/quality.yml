name: Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository structure
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f README.pt-BR.md
          test -f CONTRIBUTING.md
          test -f LICENSE
          test -d agents
          test -d skills
          test -d workflows
          test -d templates
          test -d docs
          test -d harnesses

      - name: Validate Markdown links
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            while IFS= read -r link; do
              target="${link#*](}"
              target="${target%%)*}"
              case "$target" in
                http://*|https://*|mailto:*|'#'*|'') continue ;;
              esac
              test -e "$(dirname "$file")/$target"
            done < <(grep -oE '\[[^]]+\]\([^)]*\)' "$file" || true)
          done < <(find . -name '*.md' -not -path './.git/*' -print)

      - name: Validate scripts
        shell: bash
        run: |
          set -euo pipefail
          node --check harnesses/typesafe-jev-mcp/index.mjs
          python3 tools/validate_resources.py
          python3 -m unittest discover -s tests -v

      - name: Set up Node.js for note writer harness
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: harnesses/agent-note-writer-mcp/package-lock.json

      - name: Validate note writer harness
        shell: bash
        run: |
          set -euo pipefail
          for file in harnesses/agent-note-writer-mcp/index.mjs \
            harnesses/agent-note-writer-mcp/validate-config.mjs \
            harnesses/agent-note-writer-mcp/src/*.mjs; do
            node --check "$file"
          done
          npm ci --prefix harnesses/agent-note-writer-mcp
          npm test --prefix harnesses/agent-note-writer-mcp
          node harnesses/agent-note-writer-mcp/validate-config.mjs \
            harnesses/agent-note-writer-mcp/examples/opencode.json
          node harnesses/agent-note-writer-mcp/validate-config.mjs \
            harnesses/agent-note-writer-mcp/examples/opencode.env-path.json

      - name: Write job summary
        if: always()
        run: |
          {
            echo '## Quality Summary'
            echo
            echo '| Check | Status |'
            echo '| --- | --- |'
            echo '| Repository structure | Completed |'
            echo '| Markdown links | Completed |'
            echo '| Agent handoff contract | Completed |'
            echo '| Note writer harness | Completed |'
          } >> "$GITHUB_STEP_SUMMARY"
